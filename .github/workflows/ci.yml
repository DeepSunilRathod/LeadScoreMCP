name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: dummy-key-for-ci
      DB_HOST: localhost
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: dummy-password
      DB_NAME: leads_db
      GMAIL_ADDRESS: dummy@example.com
      GMAIL_APP_PASSWORD: dummy1234567890
      TWILIO_ACCOUNT_SID: dummy-sid
      TWILIO_AUTH_TOKEN: dummy-token
      TWILIO_WHATSAPP_FROM: whatsapp:+14155238886
      ENV: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v
        continue-on-error: true

      - name: Build Docker image
        run: docker build -t leadscoremcp:latest .
